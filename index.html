<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ផ្ទះលក់បាយ គុយទាវ មីឆា - បុរីគៀងហ៊ត</title>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700;900&family=Moul&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg-dark: #120303;
      --card-bg: #1E0A0A;
      --gold-yellow: #FFD700;
      --neon-orange: #FF5722;
      --bright-red: #D90429;
      --text-light: #FFF;
    }

    * { box-sizing: border-box; font-family: 'Kantumruy Pro', sans-serif; }
    body { background-color: var(--bg-dark); margin: 0; padding-bottom: 30px; color: var(--text-light); }

    /* Hero Board */
    .hero-board {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: linear-gradient(180deg, rgba(217, 4, 41, 0.9) 0%, rgba(18, 3, 3, 0.95) 100%), 
                  url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=800&q=80') center/cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 10px;
      border-bottom: 4px solid var(--gold-yellow);
      box-shadow: 0 5px 20px rgba(217, 4, 41, 0.5);
    }

    .hero-title {
      font-family: 'Moul', cursive;
      font-size: 26px;
      color: var(--gold-yellow);
      text-shadow: 2px 2px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000,
                  0 0 15px var(--neon-orange), 0 0 25px var(--bright-red);
      margin: 0 0 5px 0;
      line-height: 1.3;
    }

    .hero-sub {
      font-size: 16px;
      font-weight: 900;
      color: #FFF;
      background: var(--bright-red);
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid var(--gold-yellow);
      margin-bottom: 6px;
    }

    .hero-badge {
      font-size: 13px;
      background: #000;
      color: var(--gold-yellow);
      padding: 4px 10px;
      border-radius: 5px;
      border: 1px solid var(--gold-yellow);
      font-weight: bold;
    }

    .today-menu-banner {
      background: linear-gradient(90deg, #D90429, #FF5722);
      color: #FFF;
      font-family: 'Moul', cursive;
      font-size: 22px;
      text-align: center;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 2px solid var(--gold-yellow);
      text-shadow: 2px 2px 4px #000;
    }

    .container { padding: 12px; }

    /* Title ធំៗបែប Title */
    .section-title {
      font-family: 'Moul', cursive;
      font-size: 25px;
      color: var(--gold-yellow);
      text-shadow: 2px 2px 4px #000, 0 0 10px var(--neon-orange);
      border-left: 8px solid var(--bright-red);
      padding-left: 10px;
      margin: 25px 0 15px 0;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .menu-card {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #331010;
      box-shadow: 0 3px 10px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
    }

    .menu-thumb {
      width: 100%;
      aspect-ratio: 4 / 5;
      position: relative;
    }

    .menu-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .menu-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
    }

    /* អក្សរមុខម្ហូបធំជាងមុន 3ដង (20px/1.8rem) */
    .menu-name { 
      font-weight: 700; 
      font-size: 17px; 
      color: #FFF; 
      margin-bottom: 5px; 
      line-height: 1.2;
    }

    /* តម្លៃអាហារនៅលើប្រអប់ +ថែម */
    .add-btn {
      background: linear-gradient(180deg, var(--bright-red), #900000);
      color: var(--gold-yellow);
      border: 2px solid var(--gold-yellow);
      padding: 12px 6px;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.6);
    }

    /* Add-ons ធំជាងមុន 3ដង */
    .addon-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
    }

    .addon-btn {
      background: linear-gradient(180deg, var(--neon-orange), #C73E00);
      color: white;
      border: 2px solid var(--gold-yellow);
      padding: 16px 10px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 17px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .box-card {
      background: var(--card-bg);
      padding: 10px;
      border-radius: 10px;
      margin-top: 18px;
      border: 2px solid #331010;
      box-shadow: 0 3px 10px rgba(0,0,0,0.5);
    }

    .khqr-box {
      text-align: center;
      background: #FFF;
      color: #000;
      border: 3px dashed var(--bright-red);
      padding: 15px;
      border-radius: 12px;
      margin: 15px 0;
    }

    .khqr-img {
      width: 150px;
      height: 150px;
      border-radius: 8px;
      border: 2px solid #000;
      margin-top: 10px;
    }

    .big-textarea {
      width: 70%;
      height: 70px;
      padding: 12px;
      font-size: 17px;
      font-weight: bold;
      background: #000;
      color: var(--gold-yellow);
      border: 2px solid var(--bright-red);
      border-radius: 8px;
    }

    select, input[type="text"], input[type="file"] {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      font-weight: bold;
      margin-top: 6px;
      margin-bottom: 8px;
      background: #2A0C0C;
      color: #FFF;
      border: 2px solid var(--bright-red);
      border-radius: 8px;
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(180deg, var(--gold-yellow), var(--neon-orange));
      color: #000;
      font-family: 'Moul', cursive;
      font-size: 17px;
      padding: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
    }

    /* ប្រអប់ទំនាក់ទំនងករណីបន្ទាន់ (អក្សរធំជាងមុន 3ដង: 24px) */
    .contact-box {
      background: #2A0C0C;
      border: 3px solid var(--gold-yellow);
      padding: 20px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.5;
      margin-top: 20px;
    }

    /* ប្រអប់ Group / Channel ធំដាច់ដោយឡែក */
    .community-card {
      background: linear-gradient(135deg, #1E0A0A, #3A0000);
      border: 3px solid var(--neon-orange);
      padding: 20px;
      border-radius: 15px;
      margin-top: 20px;
      text-align: center;
    }

    .community-btn {
      display: block;
      width: 100%;
      padding: 16px;
      margin: 10px 0;
      font-family: 'Moul', cursive;
      font-size: 17px;
      color: #FFF;
      text-decoration: none;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.5);
    }
    .btn-channel { background: #0088cc; border: 2px solid #FFF; }
    .btn-group { background: #2E8B57; border: 2px solid var(--gold-yellow); }

    /* Pop-up Modal បញ្ជាក់ការកុម្មង់ */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 15px;
      padding: 20px;
    }

    .modal-content {
      background: #1E0A0A;
      border: 4px solid var(--gold-yellow);
      border-radius: 15px;
      padding: 20px;
      width: 100%;
      width: 150%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      font-size: 17px;
      font-size: 20px;
      font-weight: bold;
      color: #FFF;
      color:  #FFD700
    }

    /* GIF Footer Section */
