<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ផ្ទះលក់បាយ គុយទាវ មីឆា - បុរីគៀងហ៊ត</title>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700;900&family=Moul&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    :root {
      --bg-dark: #120303;
      --card-bg: #1E0A0A;
      --gold-yellow: #FFD700;
      --neon-orange: #FF5722;
      --bright-red: #D90429;
      --blend-blood: #2b0505;
      --text-light: #FFF;
    }

    * { box-sizing: border-box; font-family: 'Kantumruy Pro', sans-serif; }
    body { background-color: var(--bg-dark); margin: 0; padding-bottom: 70px; color: var(--text-light); }

    .container { padding: 12px; }

    .section-title {
      font-family: 'Moul', cursive;
      font-size: 20px;
      color: var(--gold-yellow);
      border-left: 5px solid var(--bright-red);
      padding-left: 8px;
      margin: 20px 0 12px 0;
    }

    /* Menu Grid */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .menu-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #331010;
      display: flex;
      flex-direction: column;
    }

    .menu-thumb {
      width: 100%;
      aspect-ratio: 4 / 5;
      position: relative;
      cursor: pointer;
    }

    .menu-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .price-tag {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.85);
      color: var(--gold-yellow);
      font-weight: bold;
      font-size: 20px;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid var(--gold-yellow);
    }

    .menu-info { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .menu-name { font-weight: 700; font-size: 16px; color: #FFF; margin-bottom: 8px; }

    .btn-group { display: flex; gap: 5px; }

    .add-btn {
      flex: 1;
      background: linear-gradient(180deg, var(--bright-red), #900000);
      color: white; border: 1px solid var(--gold-yellow);
      padding: 8px 4px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer;
    }

    .detail-btn {
      background: #333; color: var(--gold-yellow);
      border: 1px solid var(--gold-yellow);
      padding: 8px; border-radius: 6px; font-size: 13px; cursor: pointer;
    }

    /* Detail Modal Elements */
    .modal {
      display: none; position: fixed; z-index: 200; left: 0; top: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.9); overflow: auto;
    }
    .modal-content {
      background-color: var(--blend-blood); margin: 5% auto; padding: 20px;
      border: 2px solid var(--gold-yellow); border-radius: 12px; width: 90%; max-width: 450px;
    }
    .modal-img {
      width: 100%; border-radius: 8px; border: 2px solid var(--gold-yellow);
      max-height: 250px; object-fit: cover;
    }
    .ingredient-box {
      background: #120303; padding: 12px; border-radius: 8px;
      border: 1px dashed var(--gold-yellow); margin-top: 10px; font-size: 15px; line-height: 1.6;
    }
    .close-btn {
      background: var(--bright-red); color: white; border: none;
      padding: 8px 16px; border-radius: 6px; font-size: 16px; font-weight: bold;
      margin-top: 15px; cursor: pointer; float: right;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="section-title">🍜 បញ្ជីមុខម្ហូប និងគ្រឿងផ្សំ</div>
    
    <!-- Render Auto Menu -->
    <div class="menu-grid" id="menu-container"></div>
  </div>

  <!-- Modal បង្ហាញរូបធំ និងគ្រឿងផ្សំ -->
  <div id="detailModal" class="modal">
    <div class="modal-content">
      <h2 id="modal-title" style="color:var(--gold-yellow); margin-top:0;"></h2>
      <img id="modal-img" class="modal-img" src="" alt="ម្ហូប">
      <div style="font-size: 22px; color: var(--gold-yellow); font-weight: bold; margin: 10px 0;" id="modal-price"></div>
      
      <div class="ingredient-box">
        <b style="color:var(--neon-orange);">🥗 គ្រឿងផ្សំ និងរសជាតិ៖</b><br>
        <span id="modal-ingredients"></span>
      </div>

      <button class="close-btn" onclick="closeDetailModal()">បិទ</button>
      <div style="clear:both;"></div>
    </div>
  </div>

  <script>
    // 💡 កំណត់ទិន្នន័យម្ហូប និងឈ្មោះរូបភាព (A.jpg, B.jpg, C.jpg...)
    const foodList = [
      {
        id: "A",
        name: "គុយទាវប្រហិតសាច់គោ",
        price: 7000,
        img: "A.jpg", // រូប A.jpg នៅក្នុង Folder ជាមួយ index.html
        ingredients: "🍜 មានគុយទាវ, ទឹកស៊ុបដិតក្លិនឈ្ងុយ, សាច់គោស្រស់, ប្រហិតសាច់គោ 3 គ្រាប់, សណ្តែកបណ្តុះ, សាឡាដ, ខ្ទឹមបំពង, ជីរណារ, ទឹកសៀង, ទឹកម្ទេស, និងក្រូចឆ្មារ។"
      },
      {
        id: "B",
        name: "បាយសាច់ជ្រូក ពងទាចៀន",
        price: 5000,
        img: "B.jpg", // រូប B.jpg នៅក្នុង Folder ជាមួយ index.html
        ingredients: "🍚 មានបាយស ក្តៅៗ, សាច់ជ្រូកអាំង ជ្រក់ត្រសក់/ឆាយពៅ, ពងទាចៀន 1 គ្រាប់, ទឹកត្រីបុកពិសេស និងទឹកស៊ុប។"
      },
      {
        id: "C",
        name: "មីឆាសាច់គោ ពងទា",
        price: 7000,
        img: "C.jpg", // រូប C.jpg នៅក្នុង Folder ជាមួយ index.html
        ingredients: "🍝 មីឆាក្តៅៗជាមួយសាច់គោ, ពងទាចៀន, បន្លែខាត់ណា, សណ្តែកបណ្តុះ, ទឹកសៀង និងទឹកម្ទេសឆ្ងាញ់ពិសា។"
      },
      {
        id: "D",
        name: "ដំណាប់ចេកណាំវ៉ាខ្មែរ (ល្ងខ្មៅ)",
        price: 10000,
        img: "D.jpg", // រូប D.jpg នៅក្នុង Folder ជាមួយ index.html
        ingredients: "🍌 ចេកណាំវ៉ាធម្មជាតិ 200g, ដំណាប់ស្អិតល្មួត រោយល្ងស និងល្ងខ្មៅឈ្ងុយឆ្ងាញ់ អត់សារធាតុគីមី។"
      }
    ];

    // Auto Render បង្កើតកាតម្ហូបស្វ័យប្រវត្តិ
    function renderMenu() {
      const container = document.getElementById('menu-container');
      container.innerHTML = foodList.map(item => `
        <div class="menu-card">
          <div class="menu-thumb" onclick="showDetail('${item.id}')">
            <img src="${item.img}" onerror="this.src='https://via.placeholder.com/400x500?text=រូប+${item.id}'" alt="${item.name}">
            <span class="price-tag">${item.price.toLocaleString()}៛</span>
          </div>
          <div class="menu-info">
            <div class="menu-name">${item.name}</div>
            <div class="btn-group">
              <button class="add-btn" onclick="addToCart('${item.name}', ${item.price})">កុម្មង់</button>
              <button class="detail-btn" onclick="showDetail('${item.id}')">🔍 គ្រឿងផ្សំ</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // បង្ហាញ Pop-up គ្រឿងផ្សំ និងរូបធំច្បាស់
    function showDetail(id) {
      const item = foodList.find(f => f.id === id);
      if(item) {
        document.getElementById('modal-title').innerText = item.name;
        document.getElementById('modal-img').src = item.img;
        document.getElementById('modal-price').innerText = item.price.toLocaleString() + '៛';
        document.getElementById('modal-ingredients').innerText = item.ingredients;
        document.getElementById('detailModal').style.display = 'block';
      }
    }

    function closeDetailModal() {
      document.getElementById('detailModal').style.display = 'none';
    }

    // Run Initial Render
    renderMenu();
  </script>
</body>
</html>
